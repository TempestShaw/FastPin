name: Build and package
on:
  push:
    paths: ['**']
  pull_request:
    paths: ['**']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version for manually packaged preview artifacts (no automatic publication)'
        type: string
        required: false

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, windows-2022]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          cache: true
      - name: Configure
        env:
          MANUAL_VERSION: ${{ inputs.version }}
        shell: bash
        run: |
          version="${MANUAL_VERSION:-0.1.0}"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][A-Za-z0-9.-]+)?$ ]] || { echo 'Invalid version'; exit 1; }
          if [[ "$GITHUB_REF_TYPE" == tag ]]; then version="${GITHUB_REF_NAME#v}"; fi
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DFASTPIN_VERSION="$version" -DFASTPIN_BUILD_VERSION="${{ github.run_number }}"
      - name: Build
        run: cmake --build build --config Release --parallel
      - name: Load system fonts for Windows offscreen tests
        if: runner.os == 'Windows'
        shell: pwsh
        run: '"QT_QPA_FONTDIR=$env:WINDIR/Fonts" >> $env:GITHUB_ENV'
      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure
      - name: Preserve test diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Test-results-${{ matrix.os }}
          path: |
            build/native-core-results.xml
            build/Testing/Temporary/LastTest.log
      - name: Package runtime dependencies
        run: cmake --install build --config Release --prefix "${{ github.workspace }}/build/package"
      - name: Build Windows MSIX (unsigned development artifact)
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/package-windows.ps1 -PackageDirectory build/package -Output build/FastPin-x64.msix
      - name: Verify Windows deployed runtime
        if: runner.os == 'Windows'
        run: python scripts/verify-windows-package.py build/package
      - name: Archive Windows development layout
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path build/package/* -DestinationPath build/FastPin-Windows-x64.zip
      - name: Build macOS DMG (ad-hoc development artifact)
        if: runner.os == 'macOS' && !startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          python3 -m venv build/dmg-tools
          build/dmg-tools/bin/python -m pip install dmgbuild==1.6.7
          codesign --force --deep --sign - build/package/FastPin.app
          FASTPIN_DMG_PYTHON="$PWD/build/dmg-tools/bin/python" ./scripts/package-dmg.sh build/package/FastPin.app build/FastPin-macOS.dmg
          ditto -c -k --sequesterRsrc --keepParent build/package/FastPin.app build/FastPin-macOS-arm64.zip
      - name: Build Developer ID signed and notarized macOS release
        if: runner.os == 'macOS' && startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          MACOS_CERTIFICATE_P12_BASE64: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          MACOS_SIGNING_IDENTITY: ${{ vars.MACOS_SIGNING_IDENTITY }}
          MACOS_TEAM_ID: ${{ vars.MACOS_TEAM_ID }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: ./scripts/release-macos-ci.sh
      - name: Sign macOS update feed
        if: runner.os == 'macOS' && startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: |
          [[ -n "$SPARKLE_PRIVATE_KEY" ]] || { echo 'Release publication requires SPARKLE_PRIVATE_KEY.' >&2; exit 1; }
          ./scripts/make-update-feed.sh build build/FastPin-macOS-arm64.zip "$GITHUB_REF_NAME" build/update-feed
      - uses: actions/upload-artifact@v4
        with:
          name: FastPin-${{ matrix.os }}
          path: |
            build/package/
            build/*.msix
            build/*.dmg
            build/*.zip
            build/update-feed/appcast.xml
            build/update-feed/*.delta

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/download-artifact@v4
        with:
          pattern: FastPin-*
          path: build/release
      - name: Publish packages and signed feed
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          mac=build/release/FastPin-macos-14
          windows=build/release/FastPin-windows-2022
          shopt -s nullglob
          deltas=("$mac"/update-feed/*.delta)
          args=()
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then args+=(--prerelease); fi
          (cd "$mac" && sha256sum FastPin-macOS-arm64.zip FastPin-macOS.dmg) > build/release/SHA256SUMS.txt
          (cd "$windows" && sha256sum FastPin-Windows-x64.zip FastPin-x64.msix) >> build/release/SHA256SUMS.txt
          if (( ${#deltas[@]} )); then
            (cd "$mac/update-feed" && sha256sum *.delta) >> build/release/SHA256SUMS.txt
          fi
          gh release create "$GITHUB_REF_NAME" --verify-tag --title "FastPin ${GITHUB_REF_NAME#v}" --generate-notes "${args[@]}" \
            "$mac/FastPin-macOS-arm64.zip" "$mac/FastPin-macOS.dmg" "$mac/update-feed/appcast.xml" \
            "$windows/FastPin-Windows-x64.zip" "$windows/FastPin-x64.msix" "${deltas[@]}" build/release/SHA256SUMS.txt
          cp "$mac/update-feed/appcast.xml" updates/appcast.xml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add updates/appcast.xml
          if ! git diff --cached --quiet; then
            git commit -m "Update macOS feed for $GITHUB_REF_NAME"
            git push origin HEAD:main
          fi
